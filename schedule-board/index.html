<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- 아이폰 「ホーム画面に追加」용 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="シフト管理">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>シフト管理 | Sweet Afternoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/template.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>シフト管理</h1>
    <nav class="week-nav" aria-label="週の移動">
      <button type="button" class="week-nav__step" data-week="prev" aria-label="前の週">‹</button>
      <p class="week-nav__current" aria-live="polite">
        <span class="week-nav__title" id="week-title"></span>
        <span class="week-nav__range" id="week-range"></span>
      </p>
      <button type="button" class="week-nav__step" data-week="next" aria-label="次の週">›</button>
      <button type="button" data-week="today" id="week-today">今週</button>
      <label class="week-nav__picker">日付で移動 <input type="date" id="week-picker"></label>
    </nav>
  </header>

  <main class="layout">
    <section class="poster" aria-label="プレビュー">
      <canvas id="poster"></canvas>
      <button type="button" class="poster__zoom">拡大表示</button>
      <p class="poster__hint">ポスターの枠をタップすると、その日を編集できます。</p>
    </section>

    <section class="editor" aria-label="入力">
      <div class="days" id="days"></div>
    </section>
  </main>

  <dialog class="dialog" id="day-dialog" aria-label="1日の編集">
    <div id="dialog-body"></div>
    <div class="dialog__actions">
      <button type="button" class="primary" data-action="close-dialog">完了</button>
    </div>
  </dialog>

  <dialog class="image-dialog" id="image-dialog" aria-label="画像プレビュー">
    <div class="image-dialog__viewport" id="image-viewport">
      <img id="image-preview" alt="シフト表の画像プレビュー">
    </div>
    <p class="image-dialog__hint">画像をタップすると拡大・縮小します。スマホの場合は、画像を長押しして写真に保存することもできます。</p>
    <div class="image-dialog__actions">
      <button type="button" data-action="toggle-zoom">拡大</button>
      <button type="button" data-action="close-image">閉じる</button>
      <a class="button primary" id="image-download">ダウンロード</a>
    </div>
  </dialog>

  <dialog class="data-dialog" id="data-dialog" aria-labelledby="data-dialog-title">
    <h2 id="data-dialog-title">データ移行</h2>
    <p>別のスマホやパソコンにシフトを移すときに使います。</p>
    <ol class="data-dialog__steps">
      <li>今の端末で「データを書き出す」を押し、できたファイルを送ります（AirDrop、LINE、メールなど）。</li>
      <li>移したい端末でこの画面を開き、「データを読み込む」で受け取ったファイルを選びます。</li>
    </ol>
    <p class="data-dialog__note">同じ日付のシフトは読み込んだ内容で上書きされます。それ以外の日付はそのまま残ります。</p>
    <div class="data-dialog__actions">
      <button type="button" data-action="export" class="primary">データを書き出す</button>
      <button type="button" data-action="import">データを読み込む</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="data-dialog__footer">
      <button type="button" data-action="close-data">閉じる</button>
    </div>
  </dialog>

  <footer class="actions">
    <p class="actions__status" id="status" role="status" aria-live="polite"></p>
    <div class="actions__buttons">
      <button type="button" data-action="copy-prev">前週をコピー</button>
      <button type="button" data-action="clear">この週をクリア</button>
      <button type="button" data-action="download">画像プレビュー</button>
      <button type="button" data-action="print">印刷</button>
      <button type="button" data-action="data">データ移行</button>
      <button type="button" data-action="save" class="primary">保存</button>
    </div>
  </footer>
</body>
</html>
